services:
  - type: web
    name: talky-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HF_TOKEN
        sync: false          # ستضع القيمة يدوياً في لوحة Render
      - key: GRADIO_CLIENT_FORCE_CPU
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.0"
